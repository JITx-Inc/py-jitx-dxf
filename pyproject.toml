[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jitx-dxf"
version = "0.1.0"
description = "Convert between JITX board designs and DXF format"
requires-python = ">= 3.12"
dependencies = ["ezdxf"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
jitx-dxf = "jitx_dxf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jitx_dxf"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Conservative starter ruleset — extend as the codebase tightens.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — `line-length = 100` already covers this; rest is judgement
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "B011",  # assert False is fine in tests
]
