[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jitx-dxf"
dynamic = ["version"]
description = "Convert between JITX board designs and DXF format"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">= 3.12"
authors = [
    { name = "JITX Inc." },
]
keywords = ["dxf", "eda", "jitx", "pcb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = ["ezdxf>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
build = ["build>=1.2", "twine>=6"]

[project.scripts]
jitx-dxf = "jitx_dxf.cli:main"

[project.urls]
Homepage = "https://github.com/JITx-Inc/py-jitx-dxf"
Repository = "https://github.com/JITx-Inc/py-jitx-dxf"
Issues = "https://github.com/JITx-Inc/py-jitx-dxf/issues"

[tool.hatch.version]
path = "src/jitx_dxf/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jitx_dxf"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Conservative starter ruleset — extend as the codebase tightens.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — `line-length = 100` already covers this; rest is judgement
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "B011",  # assert False is fine in tests
]
